name: CI

on:
  # A branch's commits are tested by its pull request; pushes are tested on main only, so no commit runs twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # hb-shape, the reference the shaping checks (#7) compare Skia's glyphs against.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libharfbuzz-bin
      - run: pnpm lint
      - run: pnpm typecheck
      # Postgres, the API and the sync server, from this checkout: the API's seam tests (#33) and the
      # sync server's run against them, and the API runs the migrations on start.
      - run: docker compose up -d --wait
      - run: pnpm test
      - run: pnpm --filter @dazbee/pixels exec playwright install --with-deps chromium
      - run: pnpm turbo run e2e --filter=@dazbee/pixels
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixel-diffs
          path: tests/pixels/output
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgl-vs-cpu
          path: tests/pixels/output/webgl-vs-cpu.md
          if-no-files-found: ignore
          retention-days: 30

  # The browser suite runs in jobs side by side, each against its own API and sync server: twelve
  # shards of every spec but the canvas gesture matrix, the slowest spec, and three jobs per format of
  # it. With the check and workos-sign-in jobs that is all 20 jobs GitHub runs at once; an on-demand
  # run's four parts wait for room while it runs. Tests that only take a PR's pictures (@evidence) run
  # on demand only. The speed report's tests (@perf) run in the perf job below, on main only. The sync
  # server restart test (@sync-restart) drops every tab connected to the server, so it runs on its own
  # at the end of shard 11's job, once that job's other tests are done, whether they passed or not,
  # with an HTML report of its own uploaded beside the shard's.
  e2e:
    name: e2e (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: '1', args: '--shard=1/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '2', args: '--shard=2/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '3', args: '--shard=3/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '4', args: '--shard=4/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '5', args: '--shard=5/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '6', args: '--shard=6/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '7', args: '--shard=7/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '8', args: '--shard=8/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '9', args: '--shard=9/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '10', args: '--shard=10/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: '11', args: '--shard=11/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"', alone: '--grep @sync-restart' }
          - { part: '12', args: '--shard=12/12 --grep-invert "@gesture-matrix|@perf|@sync-restart|@evidence"' }
          - { part: 'matrix-square-1', args: '--grep @gesture-matrix-sq --shard=1/3' }
          - { part: 'matrix-square-2', args: '--grep @gesture-matrix-sq --shard=2/3' }
          - { part: 'matrix-square-3', args: '--grep @gesture-matrix-sq --shard=3/3' }
          - { part: 'matrix-wide-1', args: '--grep @gesture-matrix-wide --shard=1/3' }
          - { part: 'matrix-wide-2', args: '--grep @gesture-matrix-wide --shard=2/3' }
          - { part: 'matrix-wide-3', args: '--grep @gesture-matrix-wide --shard=3/3' }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm --filter @dazbee/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@dazbee/web
      - run: pnpm --filter @dazbee/e2e exec playwright test ${{ matrix.args }}
      - if: ${{ !cancelled() && matrix.alone }}
        run: pnpm --filter @dazbee/e2e exec playwright test ${{ matrix.alone }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-alone
      - if: failure()
        run: docker compose logs api sync
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.part }}
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: failure() && matrix.alone
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.part }}-alone
          path: tests/e2e/playwright-report-alone
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-editing-${{ matrix.part }}
          path: tests/e2e/output
          if-no-files-found: ignore
          retention-days: 30

  # Signing in and out against WorkOS test mode, as the test user of WorkOS's staging environment.
  # It is not a required check, since it needs WorkOS to be up. A fork's pull request gets no
  # secrets, so the job doesn't run there; anywhere else it fails when a secret is missing.
  workos-sign-in:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
      WORKOS_TEST_EMAIL: ${{ secrets.WORKOS_TEST_EMAIL }}
      WORKOS_TEST_PASSWORD: ${{ secrets.WORKOS_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          for name in WORKOS_API_KEY WORKOS_CLIENT_ID WORKOS_TEST_EMAIL WORKOS_TEST_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::The repository secret $name is not set"; exit 1; fi
          done
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
        env:
          WORKOS_REDIRECT_URI: http://localhost:3100/callback
      - run: pnpm --filter @dazbee/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@dazbee/web
      - run: pnpm --filter @dazbee/e2e exec playwright test specs/library/workos-sign-in.spec.ts
      - if: failure()
        run: docker compose logs api
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workos-sign-in
          path: |
            tests/e2e/playwright-report
            tests/e2e/output/workos-*.png
          if-no-files-found: ignore
          retention-days: 7

  # The speed report: the editor's timings (the tests tagged @perf) on each push to main, one test
  # at a time, in this job's summary. A shared runner drawing WebGL on the CPU times the machine as
  # much as the editor, so the numbers are there to watch and never fail the run; the other tests
  # count the work instead. It starts once the browser jobs are done, passed or not, so it never
  # takes the job slot they leave free.
  perf:
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm --filter @dazbee/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@dazbee/web
      - run: |
          echo "## Speed report" >> "$GITHUB_STEP_SUMMARY"
          echo "Timings in ms for ${GITHUB_SHA::7}, on a shared 4-CPU runner drawing WebGL on the CPU (SwiftShader)." >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm --filter @dazbee/e2e exec playwright test --grep @perf --workers=1 --retries=0
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf
          path: tests/e2e/output/perf-*.json
          if-no-files-found: ignore
          retention-days: 90
