name: CI

on:
  # A branch's commits are tested by its pull request; pushes are tested on main only, so no commit runs twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # hb-shape, the reference the shaping checks (#7) compare Skia's glyphs against.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libharfbuzz-bin
      - run: pnpm lint
      - run: pnpm typecheck
      # Postgres, the API and the sync server, from this checkout: the API's seam tests (#33) and the
      # sync server's run against them, and the API runs the migrations on start.
      - run: docker compose up -d --wait
      - run: pnpm test
      - run: pnpm --filter @dazbee/pixels exec playwright install --with-deps chromium
      - run: pnpm turbo run e2e --filter=@dazbee/pixels
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixel-diffs
          path: tests/pixels/output
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgl-vs-cpu
          path: tests/pixels/output/webgl-vs-cpu.md
          if-no-files-found: ignore
          retention-days: 30

  # The browser suite runs in jobs side by side, each against its own API and sync server: twelve
  # shards of every spec but the canvas gesture matrix, the slowest spec, and three jobs per format of
  # it. With the check job that is 19 of the 20 jobs GitHub runs at once, leaving one for on-demand runs.
  e2e:
    name: e2e (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: '1', args: '--shard=1/12 --grep-invert @gesture-matrix' }
          - { part: '2', args: '--shard=2/12 --grep-invert @gesture-matrix' }
          - { part: '3', args: '--shard=3/12 --grep-invert @gesture-matrix' }
          - { part: '4', args: '--shard=4/12 --grep-invert @gesture-matrix' }
          - { part: '5', args: '--shard=5/12 --grep-invert @gesture-matrix' }
          - { part: '6', args: '--shard=6/12 --grep-invert @gesture-matrix' }
          - { part: '7', args: '--shard=7/12 --grep-invert @gesture-matrix' }
          - { part: '8', args: '--shard=8/12 --grep-invert @gesture-matrix' }
          - { part: '9', args: '--shard=9/12 --grep-invert @gesture-matrix' }
          - { part: '10', args: '--shard=10/12 --grep-invert @gesture-matrix' }
          - { part: '11', args: '--shard=11/12 --grep-invert @gesture-matrix' }
          - { part: '12', args: '--shard=12/12 --grep-invert @gesture-matrix' }
          - { part: 'matrix-square-1', args: '--grep @gesture-matrix-sq --shard=1/3' }
          - { part: 'matrix-square-2', args: '--grep @gesture-matrix-sq --shard=2/3' }
          - { part: 'matrix-square-3', args: '--grep @gesture-matrix-sq --shard=3/3' }
          - { part: 'matrix-wide-1', args: '--grep @gesture-matrix-wide --shard=1/3' }
          - { part: 'matrix-wide-2', args: '--grep @gesture-matrix-wide --shard=2/3' }
          - { part: 'matrix-wide-3', args: '--grep @gesture-matrix-wide --shard=3/3' }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm --filter @dazbee/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@dazbee/web
      - run: pnpm --filter @dazbee/e2e exec playwright test ${{ matrix.args }}
      - if: failure()
        run: docker compose logs api sync
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.part }}
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-editing-${{ matrix.part }}
          path: tests/e2e/output
          if-no-files-found: ignore
          retention-days: 30
