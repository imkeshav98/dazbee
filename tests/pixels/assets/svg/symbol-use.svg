<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="220" viewBox="-110 -110 220 220">
  <defs>
    <symbol id="petal" viewBox="0 0 20 60" preserveAspectRatio="none">
      <ellipse cx="10" cy="30" rx="10" ry="30" fill="#7C3AED" fill-opacity="0.75"/>
    </symbol>
    <circle id="dot" r="6" fill="#FACC15"/>
  </defs>
  <g id="flower">
    <use href="#petal" x="-12" y="-96" width="24" height="72"/>
    <use xlink:href="#petal" x="-12" y="-96" width="24" height="72" transform="rotate(60)"/>
    <use href="#petal" x="-12" y="-96" width="24" height="72" transform="rotate(120)"/>
    <use href="#petal" x="-12" y="-96" width="24" height="72" transform="rotate(180)"/>
    <use href="#petal" x="-12" y="-96" width="24" height="72" transform="rotate(240)"/>
    <use href="#petal" x="-12" y="-96" width="24" height="72" transform="rotate(300)"/>
    <circle r="22" fill="#F97316"/>
    <use href="#dot" x="0" y="0"/>
    <use href="#dot" x="70" y="70" opacity="0.5"/>
  </g>
</svg>
