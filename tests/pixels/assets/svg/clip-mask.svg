<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <clipPath id="round">
      <circle cx="80" cy="80" r="60"/>
    </clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="fadeout">
      <rect x="140" y="20" width="90" height="120" fill="url(#fade)"/>
    </mask>
  </defs>
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="160" height="160" fill="#0EA5E9"/>
    <rect x="0" y="20" width="160" height="20" fill="#F43F5E"/>
    <rect x="0" y="60" width="160" height="20" fill="#F43F5E"/>
    <rect x="0" y="100" width="160" height="20" fill="#F43F5E"/>
  </g>
  <rect x="140" y="20" width="90" height="120" rx="12" fill="#16A34A" mask="url(#fadeout)"/>
</svg>
